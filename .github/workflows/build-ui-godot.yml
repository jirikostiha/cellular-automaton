name: Build Godot UI

env:
  sln-path: "./src/cellular automaton godot.sln"
  dotnet-version: "8.0.x"

on:
  push:
    paths:
      - 'src/code/CellularAutomaton/**'
      - 'src/code/CellularAutomaton.UI.Godot/**'
      - '.github/workflows/build-ui-godot.yml'
  pull_request:
    paths:
      - 'src/code/CellularAutomaton/**'
      - 'src/code/CellularAutomaton.UI.Godot/**'
      - '.github/workflows/build-ui-godot.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK ${{ env.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore "${{ env.sln-path }}"

    - name: Build
      run: dotnet build "${{ env.sln-path }}" --no-restore --configuration Release
